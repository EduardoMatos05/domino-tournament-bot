name: Jugar torneo
run-name: "Jugar torneo con ${{ inputs.jugadores }} jugadores"

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL del torneo
        required: true
      jugadores:
        description: "Número de jugadores (cuentas torneo1, torneo2, ... ya inscritas)"
        required: true
        default: "8"
      velocidad:
        description: "Segundos por jugada (0.5 a 4)"
        required: true
        default: "0.5"
      desconexiones:
        description: "Opcional. Ej.: 3 1.2 1.3 = el bot 3 sale en certamen 1 partida 2 y vuelve en la 3"
        required: false

permissions:
  contents: read

# Las cuentas no pueden estar en dos corridas a la vez: la segunda espera a que termine la primera.
concurrency:
  group: cuentas-torneo

jobs:
  jugar:
    name: Jugar
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Preparar el bot
        run: |
          npm ci --no-audit --no-fund
          npx playwright install-deps chromium
      - name: Jugar el torneo
        env:
          BOT_URL: ${{ inputs.url }}
          BOT_JUGADORES: ${{ inputs.jugadores }}
          BOT_VELOCIDAD: ${{ inputs.velocidad }}
          BOT_DESCONEXIONES: ${{ inputs.desconexiones }}
        run: exec node src/cli.js
      - name: Guardar el log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-del-torneo
          path: logs/*.log
          if-no-files-found: ignore
          retention-days: 30
